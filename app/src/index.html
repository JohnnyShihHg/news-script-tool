<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>新聞文稿整理工具</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>新聞文稿整理工具</h1>
    <div class="toolbar">
      <span class="toolbar-group mode-switch">
        <button id="modeScriptBtn" class="active">文稿</button>
        <button id="modeEveningBtn">晚報</button>
      </span>

      <span class="toolbar-sep"></span>

      <span id="scriptToolbar" class="mode-pane">
      <span class="toolbar-group">
        <button id="importBtn">匯入資料夾</button>
        <button id="clearCardsBtn" disabled title="只清掉畫面上的卡片，不會刪除任何檔案">清空卡片</button>
        <button id="clearFolderBtn" class="ghost" disabled title="請先匯入資料夾">清空資料夾</button>
      </span>

      <span class="toolbar-sep"></span>

      <span class="toolbar-group">
        <button id="importInewsBtn" title="從 iNEWS 讀當節次 ONAIR rundown 裡已播出的稿件">從 iNEWS 匯入</button>
        <label class="section-label" title="定時重讀 rundown，有新的已播出稿或內容變動就自動比對、產生關鍵字並寫入（或等你確認）">
          <input type="checkbox" id="inewsAutoToggle" /> 自動刷新
        </label>
      </span>

      <span class="toolbar-sep"></span>

      <span class="toolbar-group">
        <button id="openCollabBtn">開啟協作工具</button>
        <button id="compareBtn" disabled title="請先匯入並開啟協作工具">比對 <span class="kbd-hint">Ctrl+R</span></button>
        <button id="genAllKeywordsBtn" disabled>產生關鍵字</button>
      </span>

      <span class="toolbar-sep"></span>

      <span class="toolbar-group">
        <button id="writeBackBtn" class="primary" disabled title="把輸出內容附加到協作工具文件的最下方">寫入協作工具 <span class="kbd-hint">Ctrl+Enter</span></button>
        <button id="copyBtn" class="ghost" disabled>複製全部</button>
        <button id="saveBtn" class="ghost" disabled>存成 txt</button>
      </span>
      </span>

      <span id="eveningToolbar" class="mode-pane hidden">
      <span class="toolbar-group">
        <label class="section-label">日期 <input type="date" id="evDate" /></label>
        <label class="section-label">主播 <select id="evAnchor"></select></label>
      </span>

      <span class="toolbar-sep"></span>

      <span class="toolbar-group">
        <button id="evImportBtn">匯入資料夾</button>
        <button id="evClearBtn" disabled title="只清掉晚報卡片，不會刪除任何檔案">清空卡片</button>
      </span>

      <span class="toolbar-sep"></span>

      <span class="toolbar-group">
        <button id="evOpenCollabBtn">開啟協作工具</button>
        <button id="evCompareBtn" disabled title="請先匯入並開啟協作工具">比對當天</button>
        <button id="evGenKeywordsBtn" disabled>產生關鍵字</button>
      </span>

      <span class="toolbar-sep"></span>

      <span class="toolbar-group">
        <button id="evCopyBtn" class="primary" disabled>複製清單</button>
        <button id="evSaveBtn" class="ghost" disabled>存成 txt</button>
      </span>
      </span>

      <span class="spacer"></span>
      <span id="folderLabel" class="muted"></span>
      <button id="settingsBtn" class="ghost">⚙ 設定</button>
    </div>
  </header>

  <div id="progressWrap" class="progress-wrap hidden">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <span id="progressLabel" class="progress-label"></span>
  </div>

  <div id="scriptView" class="view">
  <div id="funnel" class="funnel hidden"></div>

  <div id="inewsStatus" class="compare-status hidden"></div>
  <div id="inewsConfirm" class="compare-status inews-confirm hidden">
    <span id="inewsConfirmText"></span>
    <button id="inewsConfirmBtn" class="primary">確認寫入</button>
  </div>

  <div id="compareStatus" class="compare-status hidden"></div>

  <section id="summary" class="summary hidden">
    <button class="stat stat-passed" data-filter="passed">通過 <span id="statPassed">0</span></button>
    <button class="stat stat-unknown" data-filter="unknown">未知樣式 <span id="statUnknown">0</span></button>
    <button class="stat stat-manual" data-filter="manual">待補稿 <span id="statManual">0</span></button>
    <button class="stat stat-filtered" data-filter="filtered">已濾除 <span id="statFiltered">0</span></button>
    <button class="stat stat-failed" data-filter="failed">解析失敗 <span id="statFailed">0</span></button>
    <button class="stat stat-all" data-filter="all">全部</button>
  </section>

  <main id="list"></main>

  <footer id="emptyState" class="empty-state">
    尚未匯入任何檔案。先到「設定」綁定存放 iNews txt 的預設匯入資料夾，再點左上角「匯入資料夾」。
  </footer>
  </div>

  <div id="eveningView" class="view hidden">
    <div id="evStatus" class="compare-status hidden"></div>

    <section id="evOutput" class="ev-output hidden">
      <div class="ev-output-col">
        <div class="ev-output-head">清單（複製的內容）</div>
        <div id="evPreview"></div>
      </div>
      <div class="ev-output-col ev-slugs">
        <div class="ev-output-head">slug（方便查找，不會複製；存成 txt 時附在最下面）</div>
        <pre id="evSlugs" class="ev-pre"></pre>
      </div>
    </section>

    <main id="evList"></main>

    <footer id="evEmptyState" class="empty-state">
      尚未匯入晚報稿件。選好日期與主播，按「匯入資料夾」，再開啟協作工具按「比對當天」。
    </footer>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
