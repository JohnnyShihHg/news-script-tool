<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>新聞文稿整理工具</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="script-mode">
  <header class="topbar">
    <div class="statusbar">
      <span class="mode-switch">
        <button id="modeScriptBtn" class="active">文稿</button>
        <button id="modeEveningBtn">晚報</button>
      </span>

      <span id="scriptStatus" class="mode-pane">
        <span id="sbTally" class="tally">自動刷新關閉</span>
        <span id="sbClock" class="sb-clock mono">--:--:--</span>
        <span class="sb-kv"><small>下一輪</small><span id="sbNext" class="mono">—</span></span>
        <span class="sb-kv"><small>上次寫入</small><span id="sbLastWrite" class="mono">—</span></span>
        <span class="spacer"></span>
        <label class="auto-switch" title="定時重讀 rundown，有新的已播出稿或內容變動就自動比對、產生關鍵字並寫入（或等你確認）">
          <input type="checkbox" id="inewsAutoToggle" /><span class="sw" aria-hidden="true"></span> 自動刷新
        </label>
        <button id="writeBackBtn" class="cta" disabled title="把輸出內容附加到協作工具文件的最下方">寫入協作工具 <span class="kbd-hint">Ctrl+Enter</span></button>
      </span>

      <span id="eveningStatus" class="mode-pane hidden">
        <label class="sb-field">日期 <input type="date" id="evDate" /></label>
        <label class="sb-field">主播 <select id="evAnchor"></select></label>
        <span class="spacer"></span>
        <button id="evCopyBtn" class="cta" disabled>複製清單</button>
      </span>

      <button id="settingsBtn" class="sb-icon" title="設定">⚙ 設定</button>
    </div>

    <div class="toolbar">
      <span id="scriptToolbar" class="mode-pane">
        <button id="importInewsBtn" title="從 iNEWS 讀當節次 ONAIR rundown 裡已播出的稿件">從 iNEWS 匯入</button>
        <button id="compareBtn" disabled title="請先匯入並開啟協作工具">比對 <span class="kbd-hint">Ctrl+R</span></button>
        <button id="genAllKeywordsBtn" disabled>產生關鍵字</button>
        <button id="rundownSearchBtn" title="搜尋今天 App 讀過的 rundown slug（唯讀）">搜尋 rundown</button>
        <button id="openCollabBtn">開啟協作工具</button>
        <span class="toolbar-sep"></span>
        <section id="summary" class="summary hidden">
          <button class="stat stat-all" data-filter="all">全部</button>
          <button class="stat stat-passed" data-filter="passed">通過 <span id="statPassed">0</span></button>
          <button class="stat stat-unknown" data-filter="unknown">未知樣式 <span id="statUnknown">0</span></button>
          <button class="stat stat-manual" data-filter="manual">待補稿 <span id="statManual">0</span></button>
          <button class="stat stat-filtered" data-filter="filtered">已濾除 <span id="statFiltered">0</span></button>
          <button class="stat stat-failed" data-filter="failed">解析失敗 <span id="statFailed">0</span></button>
        </section>
        <span class="spacer"></span>
        <details class="more">
          <summary>更多 ▾</summary>
          <div class="menu">
            <span class="menu-head">匯入／輸出</span>
            <button id="importBtn">匯入資料夾</button>
            <button id="copyBtn" disabled>複製全部</button>
            <button id="saveBtn" disabled>存成 txt</button>
            <span class="menu-head">清除</span>
            <button id="clearCardsBtn" class="danger" disabled title="只清掉畫面上的卡片，不會刪除任何檔案">清空卡片</button>
            <button id="clearFolderBtn" class="danger" disabled title="請先匯入資料夾">清空資料夾…</button>
            <span id="folderLabel" class="menu-path"></span>
          </div>
        </details>
      </span>

      <span id="eveningToolbar" class="mode-pane hidden">
        <button id="evRecordsBtn" class="primary" title="先找這台電腦的本地紀錄；沒有的話直接讀 iNEWS 晚報節次（只限今天），挑晚報時段（預設 18:30～19:30）播出的稿，再比對協作文件">抓晚報稿</button>
        <button id="evOpenCollabBtn">開啟協作工具</button>
        <button id="evCompareBtn" disabled title="請先匯入並開啟協作工具">比對當天</button>
        <button id="evGenKeywordsBtn" disabled>產生關鍵字</button>
        <span class="spacer"></span>
        <details class="more">
          <summary>更多 ▾</summary>
          <div class="menu">
            <span class="menu-head">匯入／輸出</span>
            <button id="evImportBtn" title="從資料夾匯入手動匯出的晚報稿（備用）">匯入資料夾</button>
            <button id="evSaveBtn" disabled>存成 txt</button>
            <span class="menu-head">清除</span>
            <button id="evClearBtn" class="danger" disabled title="只清掉晚報卡片，不會刪除任何檔案">清空卡片</button>
          </div>
        </details>
      </span>
    </div>
  </header>

  <div id="progressWrap" class="progress-wrap hidden">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <span id="progressLabel" class="progress-label"></span>
  </div>

  <div id="scriptView" class="view">
  <div id="funnel" class="funnel hidden"></div>

  <div id="inewsStatus" class="compare-status hidden"></div>
  <div id="inewsConfirm" class="compare-status inews-confirm hidden">
    <span id="inewsConfirmText"></span>
    <button id="inewsConfirmBtn" class="primary">確認寫入</button>
  </div>

  <div id="compareStatus" class="compare-status hidden"></div>


  <div class="rundown-split">
    <div class="rundown-main">
      <div id="listHead" class="list-head hidden"><span></span><button class="sort-th" data-sort="included">輸出</button><button class="sort-th" data-sort="time">時間</button><button class="sort-th" data-sort="slug">SLUG</button><button class="sort-th" data-sort="style">樣式</button><button class="sort-th" data-sort="group">組別</button><button class="sort-th" data-sort="status">狀態</button></div>
      <main id="list"><div id="selGlide" class="sel-glide" aria-hidden="true"><span class="glide-inner"></span></div><div id="listRows"></div></main>

      <footer id="emptyState" class="empty-state">
        尚未匯入任何檔案。先從「從 iNEWS 匯入」讀稿；要用資料夾的話，先到「設定」綁定預設匯入資料夾，再點「更多 → 匯入資料夾」。
      </footer>
    </div>
    <aside id="editor" class="editor-panel" aria-label="編輯選取的稿"></aside>
  </div>
  </div>

  <div id="eveningView" class="view hidden">
    <div id="evStatus" class="compare-status hidden"></div>

    <section id="evOutput" class="ev-output hidden">
      <div class="ev-output-col">
        <div class="ev-output-head">清單（複製的內容）</div>
        <div id="evPreview"></div>
      </div>
      <div class="ev-output-col ev-slugs">
        <div class="ev-output-head">slug（方便查找，不會複製；存成 txt 時附在最下面）</div>
        <pre id="evSlugs" class="ev-pre"></pre>
      </div>
    </section>

    <main id="evList"></main>

    <footer id="evEmptyState" class="empty-state">
      尚未匯入晚報稿件。開啟協作工具、選好日期與主播，按「抓晚報稿」（本地沒紀錄會自動改讀 iNEWS；過去的日期 iNEWS 讀不到，要改用「更多 → 匯入資料夾」）。
    </footer>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
