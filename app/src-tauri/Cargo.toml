[package]
name = "news-script-tool"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
news-script-core = { path = "../../core" }
# keyring 3.x ships NO platform backend by default -- without `windows-native` it
# silently falls back to an in-memory mock store, so saved API keys vanish on restart.
keyring = { version = "3", features = ["windows-native"] }
directories = "5"
regex = "1"
tokio = { version = "1", features = ["sync", "time"] }

[[bin]]
name = "news-script-tool"
path = "src/main.rs"
