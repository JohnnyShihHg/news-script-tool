name: Check

# 每次 push 都跑一次 check.ps1（AUDIT_REPORT #2）。發版的 release.yml 也跑同一個入口。
# 全部是本機、假資料：不連 iNEWS、不碰協作文件、不呼叫 Gemini、不抓氣象署，也不需要任何 secret。
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # cargo test --workspace、clippy（不能多過 tools/check/clippy-baseline.txt）、空 catch、
      # JS 語法和 logic／lookup 測試（runner 內建 Node，check.ps1 自動用 node --check／node --test）、
      # Edge headless 跑需要 DOM 的測試頁（fake-quill、守門員）。windows-latest 內建 Node 和 Edge。
      # 不加 actions/setup-node：沒有 npm 相依、只用 node:test／node:assert，內建的 LTS 就夠；
      # 要釘版本時再加。
      - name: check.ps1
        shell: powershell
        run: ./check.ps1
