<!doctype html>
<meta charset="utf-8">
<title>fake stale</title>
<!-- 守門員「收不到別人的內容」的手動測試頁（秒數調短：保底判定 4 秒、至少 3 筆，補讀冷卻 3 秒）。
     假伺服器：after=N 回一筆小更新；after=0 回整份快照（大）。頁面「套上」後畫面會不會變看 mode：
     ?mode=ok        收到就顯示 → 不補讀、不重整
     ?mode=stale     小更新都不顯示，快照會 → 補讀一次就好，不重整
     ?mode=gap       編號跳號＋不顯示 → 不用等 4 秒，第二筆就補讀，不重整
     ?mode=gapok     編號跳號但照樣顯示 → 不補讀
     ?mode=hard      快照也救不回來 → 補讀（上限 1 次）後自動重整一次
     ?mode=typing    同 hard 但一直在打字 → 紅框、不重整
     ?mode=hidden    背景分頁（document.hidden）→ 不補讀、不重整
     ?mode=echo      只收到自己剛上傳的 → 不算
     ?mode=cold      開頁補讀（1.4.0）：讀到「已同步」就補讀整份一次，window.__collabGuard.coldBackfillDone 變 true
     ?mode=coldhidden 同 cold 但視窗縮小＋backfillWhenHidden（App 的協作視窗）→ 照樣補讀
     ?mode=toolwrite 小更新都不顯示，但 App 每 2 秒寫一筆（設 __collabGuardIgnoreDomUntil）→ 照樣補讀
     ?mode=coldhang  開頁補讀第一次請求一直不回（1.4.1）→ 2 秒逾時、2 秒後重試成功；遲到的回應不算
     （cold、coldhidden、coldhang 以外的 mode 關掉開頁補讀，只測原本的偵測）
     加 &frame=1 測 showAlertFrame 打開。window.__reqs 是頁面發出的拉取網址。
     測試前在 console 清掉：localStorage.clear(); sessionStorage.clear(); window.name = "" -->
<div id="bar"><span id="s">已同步</span></div>
<div class="ql-editor"><p>測試</p></div>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "stale";
  window.__collabGuardTestConfig = {
    staleSeconds: 4,
    staleMinUpdates: 3,
    backfillCooldownMinutes: 0.05,
    backfillMaxPerHour: mode === "hard" || mode === "typing" ? 1 : 10,
    showAlertFrame: params.get("frame") === "1",
    coldBackfill: mode === "cold" || mode === "coldhidden" || mode === "coldhang",
    backfillTimeoutSeconds: 2,
    coldRetrySeconds: 2,
    backfillWhenHidden: mode === "coldhidden",
  };
  if (mode === "hidden" || mode === "coldhidden") Object.defineProperty(document, "hidden", { get: () => true });
  const n = Number(localStorage.getItem("fakeLoads") || 0) + 1;
  localStorage.setItem("fakeLoads", String(n));
  document.title = `loads=${n}`;
  window.__reqs = [];
  window.__t0 = Date.now();
  let serverCursor = 100;
  let cursor = 100;
  window.fetch = async (input, init) => {
    const isPost = (init?.method || "GET").toUpperCase() === "POST";
    if (isPost) return new Response("{}", { status: 200 });
    window.__reqs.push(String(input));
    if (/after=0\b/.test(String(input)) && window.__firstBackfillAt == null) window.__firstBackfillAt = Date.now();
    const after = Number(String(input).match(/after=(\d+)/)[1]);
    let body;
    if (after === 0 && mode === "coldhang" && !window.__hungOnce) {
      // 第一次補讀：5 秒後才回（逾時是 2 秒），看遲到的回應會不會被當成完成。
      window.__hungOnce = true;
      await new Promise((r) => setTimeout(r, 5000));
      window.__lateArrived = true;
    }
    if (after === 0) {
      body = { updates: [{ cursor: serverCursor, update: "S".repeat(50_000) }], nextCursor: serverCursor, snapshotCursor: serverCursor, hasMore: false };
    } else {
      serverCursor += (mode === "gap" || mode === "gapok") ? 5 : 1; // 跳號：中間被刪了
      body = { updates: [{ cursor: serverCursor, update: "AAEC" }], nextCursor: serverCursor, hasMore: false };
    }
    return new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
  };
  setInterval(async () => {
    if (mode === "echo") await window.fetch("/api/sync", { method: "POST" });
    const url = `/api/sync?room=x&after=${cursor}`;
    const res = await window.fetch(url, {});
    const p = await res.json();
    cursor = Math.max(cursor, p.nextCursor);
    const isSnapshot = p.updates[0]?.update.length > 1000;
    const fixable = mode === "stale" || mode === "gap" || mode === "toolwrite";
    const shows =
      mode === "ok" || mode === "gapok" || mode === "cold" || mode === "coldhidden" || mode === "coldhang" ||
      (isSnapshot && fixable) ||
      (fixable && window.__fixed);
    if (isSnapshot && fixable) window.__fixed = true;
    if (shows) document.querySelector(".ql-editor p").textContent = `測試 ${cursor}`;
  }, 850);
  if (mode === "toolwrite") {
    // App 寫入：先標記，再改編輯器（跟 main.rs 的寫入腳本一樣）。
    setInterval(() => {
      window.__collabGuardIgnoreDomUntil = Date.now() + 2000;
      const p = document.createElement("p");
      p.textContent = "工具寫的";
      document.querySelector(".ql-editor").appendChild(p);
    }, 2000);
  }
  if (mode === "typing") {
    setInterval(() => window.dispatchEvent(new KeyboardEvent("keydown", { key: "a" })), 2000);
  }
</script>
<script src="../collab-guard.user.js"></script>
<pre id="verdict">judging…</pre>
<script>
  // 自動判定（AUDIT_REPORT #12）：載入後 JUDGE_MS 毫秒依上面每個 mode 的預期判 PASS/FAIL，
  // 寫在 #verdict 和 window.__verdict。check.ps1 用 Edge headless（每次全新的設定檔，所以
  // localStorage 是空的）逐一開每個 mode 讀這一行。手動測的話照上面說明先清掉 storage。
  // hard 會自己重整一次：第一次載入不判，第二次載入再判（重整過剛好一次、沒有再重整）。
  (function () {
    const JUDGE_MS = 15000;
    const backfills = () => window.__reqs.filter((u) => /after=0\b/.test(u));
    const firstBackfillAt = () => (window.__firstBackfillAt == null ? null : window.__firstBackfillAt - window.__t0);
    const events = () => {
      try {
        return JSON.parse(localStorage.getItem("collabGuardStaleEvents") || "[]").map((e) => e.kind);
      } catch (e) {
        console.warn("讀不到守門員的事件紀錄", e);
        return [];
      }
    };
    const g = () => window.__collabGuard || {};
    const loads = Number(localStorage.getItem("fakeLoads") || 0);
    const expect = {
      ok: () => [[backfills().length === 0, "不補讀"]],
      stale: () => [[backfills().length === 1, "補讀剛好一次"], [!!window.__fixed, "補讀後畫面有更新"]],
      gap: () => [[backfills().length >= 1, "有補讀"], [firstBackfillAt() != null && firstBackfillAt() < 4000, "不用等 4 秒就補讀"]],
      gapok: () => [[backfills().length === 0, "不補讀"]],
      hard: () => [[loads === 2, "重整剛好一次"], [events().filter((k) => k === "補讀後還是收不到，自動重整").length === 1, "紀錄只有一次自動重整"]],
      typing: () => [[backfills().length <= 1, "補讀最多一次"], [events().includes("補讀後還是收不到，等時機重整"), "打字中改成等時機重整"]],
      hidden: () => [[backfills().length === 0, "背景分頁不補讀"]],
      echo: () => [[backfills().length === 0, "自己送回來的不算"]],
      cold: () => [[g().coldBackfillDone === true, "開頁補讀完成"], [backfills().length === 1, "只補讀一次"]],
      coldhidden: () => [[g().coldBackfillDone === true, "縮小時照樣開頁補讀"], [backfills().length === 1, "只補讀一次"]],
      toolwrite: () => [[backfills().length >= 1, "App 寫入不算收得到，照樣補讀"]],
      coldhang: () => [
        [g().coldAttempts === 2, "逾時後重試一次"],
        [g().coldBackfillDone === true, "重試成功"],
        [/秒沒回應/.test(g().coldLastError || ""), "記下逾時原因"],
        [window.__lateArrived === true, "遲到的回應有回來但不算"],
      ],
    };
    const show = (text) => {
      document.getElementById("verdict").textContent = text;
      window.__verdict = text;
    };
    if (!expect[mode]) { show(`FAIL ${mode}：沒有這個 mode 的判定`); return; }
    if (mode === "hard" && loads === 1) {
      // 第一次載入：應該在 JUDGE_MS 內自己重整；沒重整就是失敗。
      setTimeout(() => show(`FAIL hard：${JUDGE_MS / 1000} 秒內沒有自動重整`), JUDGE_MS);
      return;
    }
    setTimeout(() => {
      const checks = expect[mode]();
      if (mode !== "hard") checks.push([loads === 1, "沒有重整"]);
      const bad = checks.filter(([ok]) => !ok).map(([, what]) => what);
      show(bad.length ? `FAIL ${mode}：${bad.join("、")}` : `PASS ${mode}`);
    }, JUDGE_MS);
  })();
</script>
