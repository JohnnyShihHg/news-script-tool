<!doctype html>
<meta charset="utf-8">
<title>fake cold start</title>
<!-- 守門員冷啟動規則的手動測試頁：
     ?mode=stuck 一直停在載入中（應該剛好自動重整一次）
     ?mode=ok    3 秒後讀完（不重整，記一筆約 3 秒）
     &nostorage=1 模擬網站儲存被封鎖：sessionStorage 一碰就丟錯（應該還是只重整一次） -->
<div id="bar"><span id="s">正在載入共同文章</span></div>
<div class="ql-editor"><p>測試</p></div>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "stuck";
  // 開頁次數記在 localStorage，測試前清掉。
  const n = Number(localStorage.getItem("fakeLoads") || 0) + 1;
  localStorage.setItem("fakeLoads", String(n));
  document.title = `loads=${n}`;
  if (params.get("nostorage")) {
    Object.defineProperty(window, "sessionStorage", { get() { throw new DOMException("blocked", "SecurityError"); } });
  }
  if (mode === "ok") setTimeout(() => { document.getElementById("s").textContent = "已同步"; }, 3000);
</script>
<script src="../collab-guard.user.js"></script>
